name: Release Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1, leave blank to use electron/package.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            builder_cmd: npm run release:win
          - os: ubuntu-latest
            label: Linux x64
            builder_cmd: npm run release:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies & build offline game bundle
        run: |
          npm ci
          npm run build

      - name: Resolve release version & stage Electron app
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          RAW_VERSION="${INPUT_VERSION}"
          if [ -z "$RAW_VERSION" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          fi
          RELEASE_VERSION="$RAW_VERSION" node scripts/prepare-electron.mjs

      - name: Install Electron desktop dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund

      - name: Build & publish desktop installers to GitHub Releases
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ${{ matrix.builder_cmd }}
